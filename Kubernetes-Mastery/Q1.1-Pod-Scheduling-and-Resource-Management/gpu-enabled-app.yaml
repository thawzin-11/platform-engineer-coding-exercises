apiVersion: v1
kind: Pod
metadata:
  name: gpu-enabled-app
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
            - key: env
              operator: In
              values:
              - prod
            - key: nvidia.com/gpu
              operator: Exists

  # Prevent eviction under memory pressure
  priorityClassName: system-cluster-critical

  containers:
  - name: app-container
    image: image:latest
    resources:
      requests:
        memory: "2Gi"
        cpu: "1"
      limits:
        memory: "2Gi"
        cpu: "1"
    volumeMounts:
    - name: secret-volume
      mountPath: /etc/app-secrets
      readOnly: true

  volumes:
  - name: secret-volume
    secret:
      secretName: app-secrets